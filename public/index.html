<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multiplayer Pong Arcade</title>
  <style>
    body {
      background: black;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      background: black;
      border: 4px solid white;
      display: block;
    }
    #restartBtn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      font-size: 20px;
      font-family: monospace;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <button id="restartBtn">Restart</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const socket = io();

    let playerNumber = null;
    let serverState = null;
    let ballTrail = [];
    let explosions = [];

    const restartBtn = document.getElementById("restartBtn");

    socket.on("init", (data) => {
      playerNumber = data.playerNumber;
    });

    socket.on("state", (state) => {
      serverState = state;
    });

    socket.on("restart", () => {
      restartBtn.style.display = "none";
    });

    document.addEventListener("keydown", (e) => {
      if (playerNumber === 1) {
        if (e.key.toLowerCase() === "q") socket.emit("move", { player: 1, dir: -1 });
        if (e.key.toLowerCase() === "z") socket.emit("move", { player: 1, dir: 1 });
      } else if (playerNumber === 2) {
        if (e.key.toLowerCase() === "i") socket.emit("move", { player: 2, dir: -1 });
        if (e.key.toLowerCase() === "m") socket.emit("move", { player: 2, dir: 1 });
      }
    });

    document.addEventListener("keyup", (e) => {
      if (playerNumber === 1) {
        if (["q","z"].includes(e.key.toLowerCase())) socket.emit("move", { player: 1, dir: 0 });
      } else if (playerNumber === 2) {
        if (["i","m"].includes(e.key.toLowerCase())) socket.emit("move", { player: 2, dir: 0 });
      }
    });

    restartBtn.addEventListener("click", () => {
      socket.emit("restart");
    });

    function createExplosion(x, y) {
      const particles = [];
      const colors = ["#ff4444", "#ffaa00", "#ffff44", "#ffffff"];
      for (let i = 0; i < 30; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: 3 + Math.random() * 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 60,
        });
      }
      explosions.push(particles);
    }

    function gameLoop() {
      requestAnimationFrame(gameLoop);
      if (!serverState) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const ball = serverState.ball;

      // scoring explosion trigger
      if (ball && ball.pausedUntil && Date.now() < ball.pausedUntil) {
        if (ballTrail.length > 0) {
          const last = ballTrail[ballTrail.length - 1];
          createExplosion(last.x, last.y);
          ballTrail = [];
        }
      }

      // ball trail
      if (ball) {
        ballTrail.push({ x: ball.x, y: ball.y });
        if (ballTrail.length > 15) ballTrail.shift();
      }
      for (let i = 0; i < ballTrail.length; i++) {
        let alpha = i / ballTrail.length;
        ctx.fillStyle = `rgba(255, 0, 0, ${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(ballTrail[i].x, ballTrail[i].y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // ball
      if (ball) {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // paddles
      Object.values(serverState.players).forEach((player) => {
        ctx.fillStyle = player.number === 1 ? "cyan" : "magenta";
        ctx.fillRect(
          player.number === 1 ? 20 : canvas.width - 20 - serverState.paddleWidth,
          player.y,
          serverState.paddleWidth,
          serverState.paddleHeight
        );
      });

      // explosions
      for (let e = explosions.length - 1; e >= 0; e--) {
        const particles = explosions[e];
        for (let p = particles.length - 1; p >= 0; p--) {
          const part = particles[p];
          part.x += part.vx;
          part.y += part.vy;
          part.radius *= 0.96;
          part.life--;
          ctx.fillStyle = part.color;
          ctx.globalAlpha = Math.max(0, part.life / 60);
          ctx.beginPath();
          ctx.arc(part.x, part.y, part.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          if (part.life <= 0) particles.splice(p, 1);
        }
        if (particles.length === 0) explosions.splice(e, 1);
      }

      // scores
      ctx.textAlign = "center";
      ctx.font = "64px monospace";

      ctx.fillStyle = "#0ff";
      ctx.shadowColor = "#0ff";
      ctx.shadowBlur = 20;
      ctx.fillText(serverState.scores[1], canvas.width * 0.25, 80);

      ctx.fillStyle = "#f0f";
      ctx.shadowColor = "#f0f";
      ctx.fillText(serverState.scores[2], canvas.width * 0.75, 80);
      ctx.shadowBlur = 0;

      // game over overlay
      if (serverState.gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "yellow";
        ctx.font = "48px monospace";
        const winner = serverState.scores[1] >= 11 ? 1 : 2;
        ctx.fillText(`Player ${winner} Wins!`, canvas.width / 2, canvas.height / 2 - 10);
        restartBtn.style.display = "block";
      } else {
        restartBtn.style.display = "none";
      }
    }

    gameLoop();
  </script>
</body>
</html>
